# ===== 智聘引擎 InWriting · Nginx 站点配置 =====
# 放置位置（阿里云 + Ubuntu/Debian）：
#   /etc/nginx/sites-available/inwriting
# 启用：
#   ln -s /etc/nginx/sites-available/inwriting /etc/nginx/sites-enabled/inwriting
#   nginx -t && systemctl reload nginx
#
# 作用：① 托管前端静态文件（frontend/dist）② 把 /api 反向代理到 127.0.0.1:8001
# 说明：前后端同域，因此前端代码无需配置 VITE_API_BASE，CORS 也不会触发。

server {
    listen 80;
    server_name _;          # 有域名时改成 example.com；纯 IP 访问保留 _

    # 前端构建产物目录（npm run build 的输出）
    root /opt/inwriting/frontend/dist;
    index index.html;

    # 上传简历上限需与后端 MAX_UPLOAD_MB 保持一致
    client_max_body_size 10m;

    # ---------- 传输优化 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 前端：Vue Router history 模式回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 静态资源长缓存 ----------
    # 构建产物带 hash，可放心长缓存；媒体模型体积大，缓存收益明显
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /mediapipe/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /models/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;   # 末尾的 / 会去掉 /api 前缀
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ⚠️ SSE 关键：必须关闭缓冲，否则流式面试会「憋到最后一次性吐出」
        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查（可直接用于云监控探活）
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        access_log off;
    }
}
